name: Build android

permissions: write-all

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ''

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: "ccache"
      CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-android-${{ runner.os }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy 'tools' package, which Google removed
          # from the SDK repository (sdkmanager: "Failed to find package 'tools'"). Nothing here
          # uses it: Gradle fetches platforms/build-tools itself and the NDK is installed below.
          packages: platform-tools


      - name: Install NDK
        run: sdkmanager "ndk;30.0.15729638"

      - name: Cache CMake build output
        uses: actions/cache@v4
        with:
          path: Source/Android/.cxx
          key: cxx-android-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'Source/Core/**/*.cpp', 'Source/Core/**/*.h') }}
          restore-keys: cxx-android-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_P12_BASE64 }}" | base64 -d > "$RUNNER_TEMP/dolphincs-release.p12"

      - name: Build release APK
        working-directory: Source/Android
        run: |
          VERSION="${{ inputs.version }}"
          chmod +x gradlew

          ./gradlew :app:assembleRelease --no-daemon \
            -Pkeystore="$RUNNER_TEMP/dolphincs-release.p12" \
            -Pstorepass="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pkeyalias="${{ vars.KEYSTORE_ALIAS }}" \
            -Pkeypass="${{ secrets.KEYSTORE_KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}"

          mkdir -p ../../artifact

          FOUND_APK=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*unaligned*" | head -n 1)

          if [ -n "$FOUND_APK" ]; then
            mv "$FOUND_APK" "../../artifact/dolphin-extra-android-${VERSION}-all.apk"
          else
            echo "Failed to locate APK!"
            exit 1
          fi
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.15729638

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/dolphincs-release.p12"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ./artifact/*.apk
          retention-days: 1


  # ==========================================
  # 3B. DOWNSTREAM BUILD JOB - WINDOWS
  # ==========================================
