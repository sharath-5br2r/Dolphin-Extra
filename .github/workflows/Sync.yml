name: Sync And Build

permissions: write-all

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      skip_sync:
        description: 'Skip upstream sync and build current master'
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.latest.outputs.upstream_sha }}
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Determine latest upstream master commit
        id: latest
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/dolphin-emu/dolphin.git refs/heads/master | awk '{print $1}')

          if [ -z "$UPSTREAM_SHA" ]; then
            echo "Error: Could not resolve upstream master SHA!"
            exit 1
          fi
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Latest upstream master SHA: $UPSTREAM_SHA"

      - name: Check if already synced
        id: check
        run: |
          UPSTREAM_SHA="${{ steps.latest.outputs.upstream_sha }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Triggered via workflow_dispatch; forcing run for $UPSTREAM_SHA"
          elif git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}.git" \
              "refs/tags/sync/$UPSTREAM_SHA" >/dev/null 2>&1; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "$UPSTREAM_SHA already synced, nothing to do"
            exit 0
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "$UPSTREAM_SHA is new, running full sync!"
          fi


  # ==========================================
  # 2. SYNC JOB (Fetches & merges upstream PR)
  # ==========================================

  sync:
    needs: check
    if: ${{ needs.check.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      release_tag: ${{ steps.version_info.outputs.release_tag }}
      release_name: ${{ steps.version_info.outputs.release_name }}
    steps:
      - name: Skip sync notice
        if: ${{ github.event.inputs.skip_sync == 'true' }}
        run: echo "Skipping upstream sync as requested."

      - name: Checkout master (skip_sync)
        if: ${{ github.event.inputs.skip_sync == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Checkout feature branch
        if: ${{ github.event.inputs.skip_sync != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Configure git identity
        if: ${{ github.event.inputs.skip_sync != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clean existing release-sync branch
        if: ${{ github.event.inputs.skip_sync != 'true' }}
        run: |
          git branch -D release-sync 2>/dev/null || true
          git push origin --delete release-sync 2>/dev/null || true

      - name: Fetch upstream master & checkout
        if: ${{ github.event.inputs.skip_sync != 'true' }}
        run: |
          # Rename initial local master branch to custom-patches to preserve custom changes
          git branch -m master custom-patches
          git remote add upstream https://github.com/dolphin-emu/dolphin.git || true
          git fetch upstream master --tags --quiet
          git checkout -B master "${{ needs.check.outputs.upstream_sha }}"

      - name: Merge custom patches onto master branch
        if: ${{ github.event.inputs.skip_sync != 'true' }}
        id: merge
        run: |
          set +e
          git merge custom-patches --no-edit -m "Merge custom patches into upstream master (${{ needs.check.outputs.upstream_sha }})"
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Files the fork deliberately owns. Upstream editing them is expected and should never
          # block a release: we always keep our side. Conflicts anywhere else are real and still fail the run.
          FORK_OWNED=".github/workflows/Sync.yml .github/workflows/Build.yml .github/workflows/Release.yml"
          unresolved=""
          for f in $(git diff --name-only --diff-filter=U); do
            case " $FORK_OWNED " in
              *" $f "*)
                if git cat-file -e "HEAD:$f" 2>/dev/null; then
                  git checkout --ours -- "$f" && git add -- "$f"
                else
                  git rm --quiet -- "$f"
                fi
                echo "Auto-resolved fork-owned file (kept ours): $f"
                ;;
              *) unresolved="$unresolved $f" ;;
            esac
          done

          if [ -n "$unresolved" ]; then
            echo "Unresolvable conflicts:$unresolved"
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          else
            git commit --no-edit
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          echo "Automatic merge of upstream master (${{ needs.check.outputs.upstream_sha }}) produced conflicts."
          exit 1

      - name: Update submodules
        if: ${{ github.event.inputs.skip_sync != 'true' }}
        run: git submodule update --init --recursive

      - name: Push master branch
        if: ${{ github.event.inputs.skip_sync != 'true' }}
        run: git push origin master --force

      - name: Compute release version metadata
        id: version_info
        run: |
          LATEST_TAG=$(git tag --list '[0-9][0-9][0-9][0-9]' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="2609"
          fi
          COMMIT_COUNT=$(git rev-list --count "${LATEST_TAG}..HEAD")
          VERSION="v${LATEST_TAG}-${COMMIT_COUNT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=Dolphin Extra $VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION (from tag $LATEST_TAG + $COMMIT_COUNT commits)"


  # ==========================================
  # 3A. DOWNSTREAM BUILD JOB - ANDROID
  # ==========================================

  build:
    needs: [check, sync]
    if: ${{ always() && needs.check.outputs.should_run == 'true' && (needs.sync.result == 'success' || github.event.inputs.skip_sync == 'true') }}
    uses: ./.github/workflows/Build.yml
    with:
      version: ${{ needs.sync.outputs.version }}
      release_tag: ${{ needs.sync.outputs.release_tag }}
      release_name: ${{ needs.sync.outputs.release_name }}
      upstream_sha: ${{ needs.check.outputs.upstream_sha }}
    secrets: inherit
