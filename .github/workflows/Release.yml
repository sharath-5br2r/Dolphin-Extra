name: Release

permissions: write-all

on:
  workflow_call:
    inputs:
      release_name:
        required: false
        type: string
        default: ''
      pr_number:
        required: false
        type: string
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-files
          pattern: "*-build"
          merge-multiple: true
      - name: Get Next Version Code
        id: version
        run: |
          set -euo pipefail
          YEAR=$(date -u +"%y")
          TAG=$( { gh release list -R sharath-5br2r/my-patched-apks --exclude-drafts -L 100 2>/dev/null || true; } | awk -F '\t' -v year="$YEAR" '$3 ~ "^" year "[0-9][0-9][0-9][0-9]$" {print $3}' | sort -r | head -n 1 )
          if [ -n "$TAG" ]; then
              BUILD_COUNT=${TAG:2:4}
              BUILD_COUNT=$((10#$BUILD_COUNT + 1))
          else
              BUILD_COUNT=1
          fi

          NEXT_VER_CODE=$(printf "%s%04d" "$YEAR" "$BUILD_COUNT")
          echo "NEXT_VER_CODE=$NEXT_VER_CODE" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Generate Release Notes
        id: notes
        run: |
          set -euo pipefail
          PR_NUM="${{ inputs.pr_number }}"

          echo "Built from custom master branch, merged with the custom user data storage location feature (Scoped Storage / Internal Storage / SD Card) and Games on Wii Menu Patch." > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
              echo "Built from upstream Dolphin PR \`#${PR_NUM}\`." >> release_notes.md
              echo "" >> release_notes.md
              PR_JSON=$(curl -s "https://api.github.com/repos/dolphin-emu/dolphin/pulls/$PR_NUM" || true)
              PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // empty')
              PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login // empty')
              PR_URL=$(echo "$PR_JSON" | jq -r '.html_url // empty')
              PR_BODY=$(echo "$PR_JSON" | jq -r '.body // empty')

              if [ -n "$PR_TITLE" ]; then
                  echo "### Upstream Dolphin PR [#${PR_NUM}](${PR_URL})" >> release_notes.md
                  echo "**Title:** ${PR_TITLE}" >> release_notes.md
                  if [ -n "$PR_AUTHOR" ]; then
                      echo "**Author:** [@${PR_AUTHOR}](https://github.com/${PR_AUTHOR})" >> release_notes.md
                  fi
                  echo "" >> release_notes.md
                  if [ -n "$PR_BODY" ]; then
                      echo "#### PR Description" >> release_notes.md
                      echo "${PR_BODY}" >> release_notes.md
                      echo "" >> release_notes.md
                  fi
              fi
          fi

          echo "This is an unofficial community build, not affiliated with the Dolphin team." >> release_notes.md

      - name: Generate build.json
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          python3 -c '
          import os, json, glob, subprocess, zipfile, re

          build_json = {}
          def detect_os(text):
              clean = (text or "").lower()
              if any(x in clean for x in ["macos", "mac", "darwin", "osx", ".dmg", ".pkg"]):
                  return "macOS"
              if any(x in clean for x in ["windows", "win", ".exe", ".msi"]):
                  return "Windows"
              if any(x in clean for x in ["linux", "ubuntu", "debian", ".appimage", ".deb", ".rpm"]):
                  return "Linux"
              return "Android"

          files = glob.glob("./release-files/*")
          changelog = open("release_notes.md").read() if os.path.exists("release_notes.md") else ""
          applied_patches = [
              "Custom Storage Location (Scoped Storage / Internal Storage / SD Card)",
              "Better Wii Menu (Games on Wii Menu Patch)"
          ]
          release_version = os.environ.get("RELEASE_NAME", "")

          for filepath in files:
              filename = os.path.basename(filepath)
              if filename in ("build.json", "release_notes.md"):
                  continue
              ext = os.path.splitext(filename)[1].lstrip(".")
              file_os = detect_os(filename)
              is_apk = ext.lower() == "apk"

              arch = "universal"
              if is_apk:
                  if "arm64" in filename.lower():
                      arch = "arm64-v8a"
                  elif "x86_64" in filename.lower():
                      arch = "x86_64"
                  elif "v7a" in filename.lower() or "arm32" in filename.lower():
                      arch = "armeabi-v7a"

              min_sdk = ""
              version_code = ""
              native_libraries = []
              densities = []

              if is_apk:
                  # Inspect APK using aapt2/aapt if available, else zipfile
                  try:
                      aapt = subprocess.run(["which", "aapt2"], capture_output=True, text=True).stdout.strip() or subprocess.run(["which", "aapt"], capture_output=True, text=True).stdout.strip()
                      if aapt:
                          out = subprocess.run([aapt, "dump", "badging", filepath], capture_output=True, text=True).stdout
                          m_sdk = re.search(r"(?:sdkVersion|minSdkVersion):\x27([^\x27]+)\x27", out)
                          if m_sdk:
                              min_sdk = m_sdk.group(1)
                          m_version = re.search(r"versionCode=\x27([^\x27]+)\x27", out)
                          if m_version:
                              version_code = m_version.group(1)
                          m_den = re.search(r"densities:\s*\x27([^\x27]+)\x27", out)
                          if m_den:
                              densities = [d for d in m_den.group(1).split() if d]
                          m_nat = re.search(r"native-code:\s*\x27([^\x27]+)\x27", out)
                          if m_nat:
                              native_libraries = [n for n in m_nat.group(1).split() if n]
                  except Exception as e:
                      print(f"aapt dump failed: {e}")

                  if not native_libraries and zipfile.is_zipfile(filepath):
                      try:
                          with zipfile.ZipFile(filepath, "r") as z:
                              libs = set()
                              for f in z.namelist():
                                  if f.startswith("lib/") and "/" in f[4:]:
                                      libs.add(f.split("/")[1])
                              if libs:
                                  native_libraries = sorted(list(libs))
                      except Exception as e:
                          print(f"zip inspection failed: {e}")

              lower_name = filename.lower()
              variant = None
              sub_variant = None
              entry_key = "dolphin-extra"
              package_name = "org.dolphinemu.dolphinemu"
              asset_obj = {
                  "name": filename,
                  "arch": arch,
                  "ext": f".{ext}" if ext else "",
                  "os": file_os,
                  "appliedPatches": applied_patches if is_apk else [],
                  "skippedPatches": [],
                  "failedPatches": []
              }
              if is_apk:
                  asset_obj["package_name"] = package_name
                  if min_sdk:
                      asset_obj["min_sdk"] = min_sdk
                  if version_code:
                      asset_obj["version_code"] = version_code
                  if densities:
                      asset_obj["densities"] = densities
                  if native_libraries:
                      asset_obj["native_libraries"] = native_libraries

              meta_item = {
                  "name": entry_key,
                  "version": release_version,
                  "patches": "dolphin-extra",
                  "changelog": changelog,
                  "changelog_urls": [],
                  "changelogs": [],
                  "package_name": package_name if is_apk else "",
                  "display_name": "Dolphin Emulator",
                  "patches_source": "",
                  "engine_brand": "",
                  "patch_brand": "",
                  "variant": None,
                  "sub_variant": None,
                  "assets": [asset_obj]
              }
              if entry_key in build_json:
                  build_json[entry_key]["assets"].append(asset_obj)
              else:
                  build_json[entry_key] = meta_item

          with open("build.json", "w") as f:
              json.dump(build_json, f, indent=2)
          '
          cp build.json ./release-files/build.json

      - name: Convert build.json to release manifest
        env:
          NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
          IS_PRERELEASE: "false"
        run: python3 .github/workflows/scripts/generate_build_manifest.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.sync.outputs.release_tag }}"
          name: "${{ inputs.release_name }}"
          target_commitish: master
          prerelease: false
          make_latest: true
          files: ./release-files/*
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag sync marker
        if: github.event_name != 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "sync/pr-${{ inputs.pr_number }}"
          git push origin "sync/pr-${{ inputs.pr_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger OBS build
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          if [ -n "$OBS_TOKEN" ]; then
            curl -sf -X POST \
              -H "Authorization: Token ${OBS_TOKEN}" \
              "https://api.opensuse.org/trigger/runservice?project=home:sharath-5br2r&package=Dolphin-Extra"
          fi


  trigger_cleanup:
    needs: [release]
    if: ${{ needs.release.result == 'success' }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit
