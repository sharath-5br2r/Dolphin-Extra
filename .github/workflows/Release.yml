name: Release

permissions: write-all

on:
  workflow_call:
    inputs:
      release_name:
        required: false
        type: string
        default: ''
      upstream_sha:
        required: false
        type: string
        default: ''
      release_tag:
        required: false
        type: string
        default: ''
      version:
        required: false
        type: string
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-files
          pattern: "*-build"
          merge-multiple: true

      - name: Generate Release Notes
        id: notes
        run: |
          set -euo pipefail
          UPSTREAM_SHA="${{ inputs.upstream_sha }}"

          echo "Built from custom master branch, merged with the custom user data storage location feature (Scoped Storage / Internal Storage / SD Card) and Games on Wii Menu Patch." > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$UPSTREAM_SHA" ] && [ "$UPSTREAM_SHA" != "null" ]; then
              echo "Synced with upstream Dolphin \`master\` at commit [\`${UPSTREAM_SHA:0:10}\`](https://github.com/dolphin-emu/dolphin/commit/${UPSTREAM_SHA})." >> release_notes.md
              echo "" >> release_notes.md
          fi

          echo "This is an unofficial community build, not affiliated with the Dolphin team." >> release_notes.md

      - name: Generate build.json
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version || inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 -c '
          import os, json, glob, subprocess, zipfile, re

          build_json = {}
          def detect_os(text):
              clean = (text or "").lower()
              if any(x in clean for x in ["macos", "mac", "darwin", "osx", ".dmg", ".pkg"]):
                  return "macOS"
              if any(x in clean for x in ["windows", "win", ".exe", ".msi"]):
                  return "Windows"
              if any(x in clean for x in ["linux", "ubuntu", "debian", ".appimage", ".deb", ".rpm"]):
                  return "Linux"
              return "Android"

          files = sorted(glob.glob("./release-files/*"))
          changelog = open("release_notes.md").read() if os.path.exists("release_notes.md") else ""
          release_version = os.environ.get("VERSION") or os.environ.get("RELEASE_NAME", "")

          for filepath in files:
              filename = os.path.basename(filepath)
              if filename in ("build.json", "release_notes.md"):
                  continue
              ext = os.path.splitext(filename)[1].lstrip(".")
              file_os = detect_os(filename)
              is_apk = ext.lower() == "apk"

              lower_name = filename.lower()
              arch = "universal"
              if "arm64-v8a" in lower_name:
                  arch = "arm64-v8a"
              elif "aarch64" in lower_name or "arm64" in lower_name:
                  arch = "arm64" if not is_apk else "arm64-v8a"
              elif "x86_64" in lower_name or "x64" in lower_name:
                  arch = "x86_64"
              elif "v7a" in lower_name or "arm32" in lower_name:
                  arch = "armeabi-v7a"

              min_sdk = ""
              version_code = ""
              native_libraries = []
              densities = []

              if is_apk:
                  # Inspect APK using aapt2/aapt if available, else zipfile
                  try:
                      aapt = subprocess.run(["which", "aapt2"], capture_output=True, text=True).stdout.strip() or subprocess.run(["which", "aapt"], capture_output=True, text=True).stdout.strip()
                      if not aapt:
                          android_home = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
                          candidates = sorted(glob.glob(f"{android_home}/build-tools/*/aapt2")) + sorted(glob.glob(f"{android_home}/build-tools/*/aapt"))
                          if candidates:
                              aapt = candidates[-1]
                      if aapt:
                          out = subprocess.run([aapt, "dump", "badging", filepath], capture_output=True, text=True).stdout
                          m_sdk = re.search(r"(?:sdkVersion|minSdkVersion):\x27([^\x27]+)\x27", out)
                          if m_sdk:
                              min_sdk = m_sdk.group(1)
                          m_version = re.search(r"versionCode=\x27([^\x27]+)\x27", out)
                          if m_version:
                              version_code = m_version.group(1)
                          m_den = re.search(r"densities:\s*\x27([^\x27]+)\x27", out)
                          if m_den:
                              densities = [d for d in m_den.group(1).split() if d]
                          m_nat = re.search(r"native-code:\s*\x27([^\x27]+)\x27", out)
                          if m_nat:
                              native_libraries = [n for n in m_nat.group(1).split() if n]
                  except Exception as e:
                      print(f"aapt dump failed: {e}")

                  if not native_libraries and zipfile.is_zipfile(filepath):
                      try:
                          with zipfile.ZipFile(filepath, "r") as z:
                              libs = set()
                              for f in z.namelist():
                                  if f.startswith("lib/") and "/" in f[4:]:
                                      libs.add(f.split("/")[1])
                              if libs:
                                  native_libraries = sorted(list(libs))
                      except Exception as e:
                          print(f"zip inspection failed: {e}")

              variant = None
              sub_variant = None
              entry_key = "dolphin-extra"
              package_name = "org.dolphinemu.dolphinemu"
              asset_obj = {
                  "name": filename,
                  "arch": arch,
                  "ext": f".{ext}" if ext else "",
                  "os": file_os,
                  "skippedPatches": [],
                  "failedPatches": []
              }
              if is_apk:
                  asset_obj["package_name"] = package_name
                  if min_sdk:
                      asset_obj["min_sdk"] = min_sdk
                  if version_code:
                      asset_obj["version_code"] = version_code
                  if densities:
                      asset_obj["densities"] = densities
                  if native_libraries:
                      asset_obj["native_libraries"] = native_libraries

              meta_item = {
                  "name": entry_key,
                  "version": release_version,
                  "patches": "dolphin-extra",
                  "changelog": changelog,
                  "changelog_urls": [],
                  "changelogs": [],
                  "package_name": package_name if is_apk else "",
                  "display_name": "Dolphin Emulator",
                  "patches_source": "",
                  "engine_brand": "",
                  "patch_brand": "",
                  "variant": None,
                  "sub_variant": None,
                  "assets": [asset_obj]
              }
              if entry_key in build_json:
                  build_json[entry_key]["assets"].append(asset_obj)
                  if is_apk and not build_json[entry_key]["package_name"]:
                      build_json[entry_key]["package_name"] = package_name
              else:
                  build_json[entry_key] = meta_item

          with open("build.json", "w") as f:
              json.dump(build_json, f, indent=2)
          '
          cp build.json ./release-files/build.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ inputs.release_tag }}"
          name: "${{ inputs.release_name }}"
          target_commitish: master
          prerelease: false
          make_latest: true
          files: ./release-files/*
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag sync marker
        if: github.event_name != 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "sync/${{ inputs.upstream_sha }}"
          git push origin "sync/${{ inputs.upstream_sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger OBS build
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          if [ -n "$OBS_TOKEN" ]; then
            curl -sf -X POST \
              -H "Authorization: Token ${OBS_TOKEN}" \
              "https://api.opensuse.org/trigger/runservice?project=home:sharath-5br2r&package=Dolphin-Extra"
          fi


  trigger_cleanup:
    needs: [release]
    if: ${{ needs.release.result == 'success' }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit
