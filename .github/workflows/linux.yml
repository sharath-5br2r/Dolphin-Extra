name: Build linux

permissions: write-all

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ''

jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target_triple: ""
            cmake_flags: ""
          - arch: arm64-v8a
            runner: ubuntu-24.04-arm
            target_triple: ""
            cmake_flags: ""
    env:
      CMAKE_C_COMPILER_LAUNCHER: "ccache"
      CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install libcurl4-openssl-dev build-essential git cmake gettext ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libevdev-dev libudev-dev libxrandr-dev libxi-dev libpulse-dev libqt6svg6-dev libasound2-dev libgudev-1.0-dev liblzma-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev libsoundtouch-dev libminiupnpc-dev libmbedtls-dev libao-dev libbluetooth-dev libreadline-dev libusb-1.0-0-dev qt6-base-dev qt6-base-private-dev qt6-tools-dev-tools libzstd-dev libzstd1 ninja-build ccache p7zip-full libarchive-dev -y
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            sudo apt install libc6-i386 gcc-multilib g++-multilib -y || true
          fi
          sudo apt install libudev-dev libsystemd-dev -y || sudo apt install libeudev-dev -y

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-linux-${{ matrix.arch }}-${{ runner.os }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Install latest Clang
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo ln -sf /usr/bin/ld.lld-23 /usr/bin/ld.lld

      - name: Configure CMake (${{ matrix.arch }})
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23 -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE="-O3 -g -flto=thin -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -g -flto=thin -DNDEBUG" -DCMAKE_EXE_LINKER_FLAGS="-flto=thin -fuse-ld=lld" -DLINUX_LOCAL_DEV=true -DUSE_SYSTEM_LIBS=OFF ${{ matrix.cmake_flags }} ..

      - name: Build (${{ matrix.arch }})
        run: |
          cd build
          ninja dolphin-emu
          touch Binaries/portable.txt

      - name: "Package Linux Dolphin (${{ matrix.arch }})"
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="${{ inputs.version }}"
          FILE_NAME="dolphin-extra-linux-${VERSION}-${{ matrix.arch }}.zip"

          mkdir -p artifact
          cd build/Binaries
          zip -r "../../artifact/${FILE_NAME}" ./*

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-build
          path: "./artifact/*.zip"
          retention-days: 1


